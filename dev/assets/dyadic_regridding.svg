<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4a5c"/>
    </marker>
  </defs>

  <!-- own light panel so the sketch stays readable on dark documentation themes -->
  <rect x="0" y="0" width="760" height="590" rx="12" fill="#ffffff" stroke="#d5dbe3"/>

  <!-- ============ Top: one coarse cell and its four fine children ============ -->

  <!-- fine grid (grid 1) -->
  <g transform="translate(50,40)">
    <rect x="0"   y="0"   width="100" height="100" fill="#dcebf7" stroke="#3a4a5c" stroke-width="1.5"/>
    <rect x="100" y="0"   width="100" height="100" fill="#b9d6ee" stroke="#3a4a5c" stroke-width="1.5"/>
    <rect x="0"   y="100" width="100" height="100" fill="#eef5fb" stroke="#3a4a5c" stroke-width="1.5"/>
    <rect x="100" y="100" width="100" height="100" fill="#8fbde3" stroke="#3a4a5c" stroke-width="1.5"/>
    <g font-size="22" text-anchor="middle" fill="#1d2733">
      <text x="50"  y="58">2</text>
      <text x="150" y="58">4</text>
      <text x="50"  y="158">1</text>
      <text x="150" y="158">5</text>
    </g>
    <text x="100" y="228" text-anchor="middle" fill="#1d2733">grid 1 · 1 km</text>
    <text x="100" y="246" text-anchor="middle" fill="#5b6b7d" font-size="12">4 fine cells</text>
  </g>

  <!-- coarse grid (grid 2) -->
  <g transform="translate(510,40)">
    <rect x="0" y="0" width="200" height="200" fill="#b9d6ee" stroke="#3a4a5c" stroke-width="2.5"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke="#3a4a5c" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#3a4a5c" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <rect x="80" y="80" width="40" height="40" rx="6" fill="#b9d6ee"/>
    <text x="100" y="111" text-anchor="middle" font-size="30" fill="#1d2733">3</text>
    <text x="100" y="228" text-anchor="middle" fill="#1d2733">grid 2 · 2 km</text>
    <text x="100" y="246" text-anchor="middle" fill="#5b6b7d" font-size="12">1 coarse cell, perfectly overlapping</text>
  </g>

  <!-- coarsening arrow -->
  <line x1="270" y1="95" x2="490" y2="95" stroke="#3a4a5c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="78" text-anchor="middle" font-weight="bold" fill="#1d2733">AverageCoarsening</text>
  <text x="380" y="118" text-anchor="middle" fill="#5b6b7d" font-size="12">(2 + 4 + 1 + 5) / 4 = 3 — the exact cell mean</text>

  <!-- refinement arrow -->
  <line x1="490" y1="185" x2="270" y2="185" stroke="#3a4a5c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="168" text-anchor="middle" font-weight="bold" fill="#1d2733">Constant / LinearRefinement</text>
  <text x="380" y="208" text-anchor="middle" fill="#5b6b7d" font-size="12">child value = T<tspan baseline-shift="sub" font-size="9">c</tspan> + Σ s<tspan baseline-shift="sub" font-size="9">d</tspan> w<tspan baseline-shift="sub" font-size="9">d</tspan> over the axes d</text>

  <!-- ============ Bottom: why refinement is conservative ============ -->
  <line x1="40" y1="300" x2="720" y2="300" stroke="#d5dbe3"/>
  <text x="40" y="330" font-weight="bold" fill="#1d2733">Linear reconstruction in one coarse cell (1D, ratio 2)</text>

  <g transform="translate(0,0)">
    <!-- axis -->
    <line x1="80" y1="500" x2="680" y2="500" stroke="#3a4a5c"/>
    <!-- coarse cell boundaries -->
    <g stroke="#3a4a5c" stroke-width="1">
      <line x1="80"  y1="360" x2="80"  y2="500"/>
      <line x1="280" y1="360" x2="280" y2="500"/>
      <line x1="480" y1="360" x2="480" y2="500"/>
      <line x1="680" y1="360" x2="680" y2="500"/>
    </g>
    <!-- fine cell boundary inside the middle coarse cell -->
    <line x1="380" y1="370" x2="380" y2="500" stroke="#3a4a5c" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- neighbour coarse values (T = 1 and T = 4): y = 500 - 30 T -->
    <line x1="80"  y1="470" x2="280" y2="470" stroke="#8a97a6" stroke-width="3"/>
    <line x1="480" y1="380" x2="680" y2="380" stroke="#8a97a6" stroke-width="3"/>
    <text x="180" y="462" text-anchor="middle" fill="#5b6b7d" font-size="12">T = 1</text>
    <text x="580" y="372" text-anchor="middle" fill="#5b6b7d" font-size="12">T = 4</text>

    <!-- middle cell: coarse mean T_c = 3 and the reconstruction with slope s = (4 - 1) / 2 -->
    <line x1="280" y1="410" x2="480" y2="410" stroke="#8a97a6" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="286" y="403" fill="#5b6b7d" font-size="12">T<tspan baseline-shift="sub" font-size="9">c</tspan> = 3</text>
    <line x1="280" y1="432.5" x2="480" y2="387.5" stroke="#2f78c4" stroke-width="2"/>
    <!-- fine-cell means at w = -1/4 and +1/4: 3 ∓ 0.375 -->
    <line x1="285" y1="421.25" x2="375" y2="421.25" stroke="#c4432f" stroke-width="4"/>
    <line x1="385" y1="398.75" x2="475" y2="398.75" stroke="#c4432f" stroke-width="4"/>
    <text x="330" y="444" text-anchor="middle" fill="#c4432f" font-size="12">2.625</text>
    <text x="430" y="388" text-anchor="middle" fill="#c4432f" font-size="12">3.375</text>

    <text x="280" y="518" text-anchor="middle" fill="#5b6b7d" font-size="12">ξ = −½</text>
    <text x="380" y="518" text-anchor="middle" fill="#5b6b7d" font-size="12">0</text>
    <text x="480" y="518" text-anchor="middle" fill="#5b6b7d" font-size="12">½</text>
  </g>

  <g font-size="12" fill="#1d2733">
    <line x1="80" y1="546" x2="100" y2="546" stroke="#2f78c4" stroke-width="2"/>
    <text x="108" y="550">reconstruction T<tspan baseline-shift="sub" font-size="9">c</tspan> + s ξ, with the slope s = (4 − 1) / 2 taken from the neighbours</text>
    <line x1="80" y1="570" x2="100" y2="570" stroke="#c4432f" stroke-width="4"/>
    <text x="108" y="574">fine-cell means at offsets w = ±¼: the offsets sum to zero, so the means average back to T<tspan baseline-shift="sub" font-size="9">c</tspan></text>
  </g>
</svg>
